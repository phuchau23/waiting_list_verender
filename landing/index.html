<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verendar — Chăm sóc xe máy minh bạch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #fff;
      color: #1a1a1a;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .banner {
      width: 100%;
      display: block;
    }
    .banner img {
      width: 100%;
      height: auto;
      display: block;
    }

    main {
      flex: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 24px 64px;
      text-align: center;
    }

    .logo {
      width: 120px;
      margin: 0 auto 28px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #111;
    }

    p {
      font-size: 1rem;
      color: #555;
      margin-bottom: 12px;
    }

    footer {
      border-top: 1px solid #eee;
      padding: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: #999;
    }

    footer a {
      color: #c81e1e;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .powered {
      margin-top: 6px;
      font-size: 0.75rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="banner">
    <img src="images/banner.png" alt="Verendar — Take care your bike, like your wallet">
  </div>

  <main>
    <img class="logo" src="images/logo.png" alt="Verendar">
    <h1>Nền tảng đặt lịch sửa xe &amp; chăm sóc xe máy</h1>
    <p>Verendar giúp chủ xe kết nối garage uy tín, theo dõi bảo dưỡng và nhận báo giá minh bạch — đơn giản, rõ ràng.</p>
    <p>Sản phẩm đang trong giai đoạn phát triển. Hẹn gặp bạn sớm.</p>
  </main>

  <footer>
    <div>© 2026 Verendar</div>
    <div class="powered">Powered by <a href="https://dream-lab.ai" target="_blank" rel="noopener noreferrer">Dream Lab AI</a></div>
  </footer>

</body>
</html>
